<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6e5434">
  <title>Punjabi watch — the time, in Punjabi</title>
  <meta name="description" content="A sundial, the time in Punjabi words, and today's Nanakshahi date.">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="/assets/favicon-48.png" sizes="48x48" type="image/png"><link rel="icon" href="/assets/favicon-192.png" sizes="192x192" type="image/png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/noto-sans-gurmukhi.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head>
<body class="ocean-home">
<main id="main">
  <section class="clock-section ocean-hero" aria-labelledby="clock-heading">
    <h1 id="clock-heading" class="sr-only">The time, in Punjabi</h1>
    <svg id="sundial" class="sundial" viewBox="0 0 1024 1024" aria-hidden="true"></svg>
    <div class="main-clock" role="timer" aria-label="Current local time in Punjabi">
      <p id="day-period" class="day-period" lang="pa">ਇਸ ਵੇਲੇ</p>
      <p id="time-words" class="time-words" lang="pa">—</p>
    </div>
    <div class="ocean-date"><p id="nanakshahi-date" lang="pa">—</p><p id="gregorian-date"></p></div>
    <noscript><p class="notice">Enable JavaScript to see the sundial, the time and the date.</p></noscript>
    <p id="clock-error" class="notice" hidden></p>
  </section>
</main>
<div class="sky-desaturate" aria-hidden="true"></div>
<svg id="sun-light" class="sun-light" aria-hidden="true"></svg>
<div class="sky-glow" aria-hidden="true"></div>
<div class="sky-soften" aria-hidden="true"></div>
<div class="sky-night" aria-hidden="true"></div>
</body></html>
